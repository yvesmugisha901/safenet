name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Lint, Type-Check & Build
  # Runs on every push and pull request.
  # Blocks Vercel deploy if anything fails.
  # ─────────────────────────────────────────
  ci:
    name: Lint, Type-Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc)
        run: npx tsc --noEmit

      - name: Lint (ESLint)
        run: npx eslint "src/**/*.{ts,tsx}" --max-warnings=0
        # If ESLint isn't set up yet, see PIPELINE_SETUP.md for install steps

      - name: Build (Vite)
        run: npm run build
        # Catches broken imports, missing modules, or JSX errors
        # that tsc alone won't always surface

  # ─────────────────────────────────────────
  # JOB 2: Deploy via Vercel CLI
  # Only runs after CI passes.
  # Only triggers on push to main or dev
  # (Vercel handles PR preview deploys itself).
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build via Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}